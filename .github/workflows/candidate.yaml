name: Candidate build

# When upstream cuts a new release, build it and publish to the candidate
# channel for QA. Promotion to stable is manual (see promote.yaml). No GitHub
# releases are created: we compare upstream against the version already in the
# store's candidate channel and only build when it is newer.
on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.v.outputs.build }}
      upstream: ${{ steps.v.outputs.upstream }}
    steps:
      - name: Compare upstream vs store candidate
        id: v
        run: |
          UP=$(curl -sL https://pypi.org/pypi/hermes-agent/json | jq -r '.info.version')
          UP=${UP#v}
          CUR=$(curl -fsSL -H 'Snap-Device-Series: 16' \
            "https://api.snapcraft.io/v2/snaps/info/hermes-agent" 2>/dev/null \
            | jq -r '[.["channel-map"][] | select(.channel.name=="candidate") | .version] | first // ""')
          echo "upstream=$UP"   >> "$GITHUB_OUTPUT"
          echo "candidate=$CUR" >> "$GITHUB_OUTPUT"
          if [ -n "$UP" ] && [ "$UP" != "$CUR" ]; then
            echo "build=yes" >> "$GITHUB_OUTPUT"
          else
            echo "build=no" >> "$GITHUB_OUTPUT"
          fi
          echo "upstream='$UP' candidate='$CUR'"

  build:
    needs: check
    if: needs.check.outputs.build == 'yes'
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1

      # Gate publishing on the snap actually running. "strict" commands must
      # exit 0; "nocrash" commands may exit non-zero (e.g. the lemonade picker
      # with no lemonade-server in CI) but must not hang, be missing (126/127)
      # or die from a signal (>128, e.g. 139 = segfault). The .daemon apps are
      # not exercised: they start real servers even when passed --help.
      - name: Smoke test
        run: |
          sudo snap install --dangerous --classic "${{ steps.build.outputs.snap }}"
          export PATH="/snap/bin:$PATH"
          fail=0
          check() {
            mode=$1; shift
            echo "::group::$*"
            rc=0
            timeout -k 5 120 "$@" </dev/null >"$RUNNER_TEMP/smoke.out" 2>&1 || rc=$?
            head -40 "$RUNNER_TEMP/smoke.out"
            echo "::endgroup::"
            if [ "$mode" = strict ] && [ "$rc" -ne 0 ]; then
              echo "::error::'$*' exited $rc"; fail=1
            elif [ "$rc" -eq 124 ] || [ "$rc" -ge 126 ]; then
              echo "::error::'$*' hung or crashed (exit $rc)"; fail=1
            fi
          }
          check strict hermes-agent --help
          check nocrash hermes-agent --version
          check nocrash hermes-agent.lemonade
          exit $fail

      - name: Publish to candidate (${{ needs.check.outputs.upstream }} / ${{ matrix.arch }})
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: candidate
