name: PR smoke test

on:
  pull_request:
    paths:
      - 'snap/**'
      - 'package.json'
      - '.github/workflows/pr.yaml'

permissions:
  contents: read

jobs:
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1

      - name: Install snap
        run: |
          echo "Installing ${{ steps.build.outputs.snap }}"
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}" --classic

      - name: Check bundled skills
        run: |
          test -n "$(find /snap/hermes-agent/current/skills -type f -name SKILL.md -print -quit)"

      - name: Test hermes-agent CLI
        run: |
          hermes-agent --version 2>&1 || true
          hermes-agent --help 2>&1 | head -20 || true

      - name: Test daemon command
        run: |
          timeout 20 hermes-agent.daemon --help 2>&1 | head -20 || true
