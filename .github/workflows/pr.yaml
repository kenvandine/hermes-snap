name: PR smoke test

on:
  pull_request:
    paths:
      - 'snap/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1

      - name: Install snap
        run: |
          echo "Installing ${{ steps.build.outputs.snap }}"
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}" --classic

      - name: Check bundled skills
        run: |
          test -n "$(find /snap/hermes-agent/current/skills -type f -name SKILL.md -print -quit)"

      - name: Test hermes-agent CLI
        run: |
          hermes-agent --version 2>&1 || true
          hermes-agent --help 2>&1 | head -20 || true

      - name: Test daemon command
        run: |
          hermes-agent.daemon --help 2>&1 | head -20 || true
